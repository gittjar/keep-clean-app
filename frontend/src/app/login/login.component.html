<div class="login-wrapper">
  <div class="login-card">
    <h2>{{ isRegister ? 'Luo käyttäjä' : 'Kirjaudu sisään' }}</h2>
    <p class="subtitle">Keep Clean Admin</p>

    <form (ngSubmit)="submit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Käyttäjänimi</label>
        <input
          id="username"
          type="text"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          required
          placeholder="Käyttäjänimi"
          autocomplete="username"
        />
      </div>

      <div class="form-group mt-3">
        <label for="pin">PIN-koodi</label>
        <input
          id="pin"
          type="password"
          class="form-control"
          [(ngModel)]="pin"
          name="pin"
          required
          minlength="4"
          placeholder="Vähintään 4 merkkiä"
          autocomplete="current-password"
          inputmode="numeric"
        />
      </div>

      <div *ngIf="isRegister" class="form-group mt-3">
        <label for="adminCode">Admin-koodi <span class="text-muted">(valinnainen)</span></label>
        <input
          id="adminCode"
          type="password"
          class="form-control"
          [(ngModel)]="adminCode"
          name="adminCode"
          placeholder="Jätä tyhjäksi tavalliselle käyttäjälle"
          autocomplete="off"
        />
        <small class="text-muted">Anna admin-koodi saadaksesi ylimmän hallintatason.</small>
      </div>

      <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>

      <button
        type="submit"
        class="btn btn-primary w-100 mt-4"
        [disabled]="loading || !username || pin.length < 4"
      >
        {{ loading ? 'Ladataan...' : (isRegister ? 'Rekisteröidy' : 'Kirjaudu') }}
      </button>
    </form>

    <hr />

    <button class="btn btn-link w-100" (click)="toggleMode()">
      {{ isRegister ? 'Minulla on jo käyttäjä – kirjaudu' : 'Luo uusi käyttäjä' }}
    </button>
  </div>
</div>
